name: Kultura CI / CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-qa:
    name: Backend Lint, Test & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi
          pip install flake8 pytest pytest-asyncio httpx

      - name: Code quality & Linting (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max complexity 15.
          flake8 server --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Start Gateway & Run QA Test Suite
        env:
          ADMIN_ID: omchoksi99@gmail.com
          ADMIN_PASS: ucantrustme
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: |
          PYTHONPATH=server uvicorn main:app --app-dir server --port 8000 &
          sleep 3
          python server/scripts/test_observability_qa.py

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Run Next.js Production Build
        run: |
          cd client
          npm run build
